<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nova contrasenya | HORIZON270+</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

<main class="auth-container">

    <a href="index.html" class="auth-logo">
        HORIZON<span>270+</span>
    </a>

    <section class="auth-card">

        <div class="auth-header">

            <span class="section-label">
                HORIZON270+
            </span>

            <h1>
                Nova contrasenya
            </h1>

            <p>
                Escriu la nova contrasenya del teu compte.
            </p>

        </div>

        <div
            id="resetMessage"
            class="auth-message"
            hidden
        ></div>

        <form id="resetForm">

            <div class="auth-field">

                <label for="password">
                    Nova contrasenya
                </label>

                <div class="password-input">

                    <input
                        type="password"
                        id="password"
                        placeholder="Nova contrasenya"
                        autocomplete="new-password"
                        required
                        minlength="6"
                    >

                    <button
                        type="button"
                        id="togglePassword"
                        class="password-toggle"
                    >
                        👁
                    </button>

                </div>

            </div>


            <div class="auth-field">

                <label for="passwordConfirm">
                    Repetir contrasenya
                </label>

                <div class="password-input">

                    <input
                        type="password"
                        id="passwordConfirm"
                        placeholder="Repeteix la contrasenya"
                        autocomplete="new-password"
                        required
                        minlength="6"
                    >

                    <button
                        type="button"
                        id="togglePasswordConfirm"
                        class="password-toggle"
                    >
                        👁
                    </button>

                </div>

            </div>


            <button
                type="submit"
                id="resetButton"
                class="auth-submit"
            >
                Canviar contrasenya
            </button>

        </form>

    </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://eftxwdpdweomffgurlgm.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_DPCJgsTp66cw2s-5S3CqNg_AdJEHKpt";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const form =
    document.getElementById("resetForm");

const password =
    document.getElementById("password");

const passwordConfirm =
    document.getElementById("passwordConfirm");

const resetButton =
    document.getElementById("resetButton");

const message =
    document.getElementById("resetMessage");


function showMessage(text, type = "error") {

    message.textContent = text;

    message.className =
        "auth-message " + type;

    message.hidden = false;

}


document
    .getElementById("togglePassword")
    .addEventListener("click", () => {

        password.type =
            password.type === "password"
            ? "text"
            : "password";

    });


document
    .getElementById("togglePasswordConfirm")
    .addEventListener("click", () => {

        passwordConfirm.type =
            passwordConfirm.type === "password"
            ? "text"
            : "password";

    });


form.addEventListener(
    "submit",
    async (event) => {

        event.preventDefault();

        message.hidden = true;


        if (password.value.length < 6) {

            showMessage(
                "La contrasenya ha de tenir almenys 6 caràcters."
            );

            return;

        }


        if (
            password.value !==
            passwordConfirm.value
        ) {

            showMessage(
                "Les contrasenyes no coincideixen."
            );

            return;

        }


        resetButton.disabled = true;

        resetButton.textContent =
            "Guardant...";


        try {

            const {
                error
            } =
                await supabaseClient.auth.updateUser({
                    password: password.value
                });


            if (error) {
                throw error;
            }


            showMessage(
                "Contrasenya canviada correctament.",
                "success"
            );


            setTimeout(() => {

                window.location.href =
                    "login.html";

            }, 1800);


        } catch (error) {

            console.error(error);

            showMessage(
                "No s'ha pogut canviar la contrasenya. Torna a obrir l'enllaç del correu."
            );


        } finally {

            resetButton.disabled = false;

            resetButton.textContent =
                "Canviar contrasenya";

        }

    }
);

</script>

</body>
</html>
