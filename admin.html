<!DOCTYPE html>

<html lang="ca">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>HORIZON270+ | Administració</title>

<style>

*{box-sizing:border-box}

body{
    margin:0;
    background:#050505;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

header{
    height:70px;
    display:flex;
    align-items:center;
    padding:0 5%;
    background:#080808;
    border-bottom:1px solid #222;
}

.logo{
    font-size:25px;
    font-weight:900;
}

.logo span{color:#aaa}

main{
    padding:40px 5%;
    max-width:1200px;
    margin:auto;
}

.panel{
    background:#111;
    border:1px solid #292929;
    border-radius:8px;
    padding:25px;
    margin-bottom:20px;
}

.grid{
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(220px,1fr));
    gap:18px;
}

button{
    width:100%;
    padding:18px;
    background:#181818;
    color:white;
    border:1px solid #444;
    border-radius:6px;
    cursor:pointer;
    font-size:15px;
}

button:hover{
    background:#242424;
}

.logout{
    margin-left:auto;
    width:auto;
    padding:10px 16px;
}

</style>

</head>

<body>

<header>

<div class="logo">
HORIZON<span>270+</span>
</div>

<button
class="logout"
onclick="logout()"

>

Tancar sessió </button>

</header>

<main>

<h1>Panell d'administració</h1>

<p>
Gestiona tot el contingut de HORIZON270+.
</p>

<div
    id="error"
    class="panel"
    hidden
>
No tens permisos d'administrador.
</div>

<div
    id="admin"
    hidden
>

<div class="panel">

<h2>🎬 Contingut</h2>

<div class="grid">

<button>
➕ Crear pel·lícula
</button>

<button>
➕ Crear sèrie
</button>

<button>
📺 Crear temporada
</button>

<button>
▶️ Crear episodi
</button>

</div>

</div>

<div class="panel">

<h2>👥 Informació</h2>

<div class="grid">

<button>
🎭 Gestionar actors
</button>

<button>
🎞️ Gestionar tràilers
</button>

<button>
🔗 Contingut relacionat
</button>

<button>
⭐ Contingut similar
</button>

</div>

</div>

<div class="panel">

<h2>📅 Llançaments</h2>

<div class="grid">

<button>
Programar estrena
</button>

<button>
Gestionar estrenes
</button>

</div>

</div>

</div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabaseClient =
window.supabase.createClient(
    "https://eftxwdpdweomffgurlgm.supabase.co",
    "sb_publishable_DPCJgsTp66cw2s-5S3CqNg_AdJEHKpt"
);

async function start(){

    const {data}=
    await supabaseClient.auth.getSession();

    if(!data.session){

        window.location.replace(
            "login.html"
        );

        return;

    }

    /*
      Aquesta comprovació és només
      la protecció visual inicial.
      Després farem la protecció
      real amb RLS a Supabase.
    */

    const type =
        data.session.user.user_metadata
        ?.account_type;

    if(type === "admin"){

        document.getElementById(
            "admin"
        ).hidden=false;

    }else{

        document.getElementById(
            "error"
        ).hidden=false;

    }

}

async function logout(){

    await supabaseClient.auth.signOut();

    window.location.replace(
        "index.html"
    );

}

start();

</script>

</body>
</html>
