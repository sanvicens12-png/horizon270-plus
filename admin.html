<!DOCTYPE html>

<html lang="ca">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HORIZON270+ | Administració</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #050505;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

header {
    height: 70px;
    display: flex;
    align-items: center;
    padding: 0 5%;
    background: #080808;
    border-bottom: 1px solid #222;
}

.logo {
    font-size: 25px;
    font-weight: 900;
}

.logo span {
    color: #aaa;
}

.back {
    margin-left: auto;
    color: white;
    text-decoration: none;
    border: 1px solid #555;
    padding: 10px 16px;
    border-radius: 5px;
}

main {
    max-width: 1100px;
    margin: auto;
    padding: 40px 25px;
}

h1 {
    font-size: 38px;
}

.panel {
    background: #111;
    border: 1px solid #292929;
    border-radius: 8px;
    padding: 25px;
    margin-bottom: 25px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(
        auto-fit,
        minmax(220px, 1fr)
    );
    gap: 18px;
}

label {
    display: block;
    margin-bottom: 7px;
    color: #bbb;
}

input,
textarea,
select {
    width: 100%;
    padding: 13px;
    margin-bottom: 18px;
    background: #080808;
    color: white;
    border: 1px solid #444;
    border-radius: 5px;
    font-size: 15px;
}

input[type="checkbox"] {
    width: auto;
    margin-right: 8px;
}

input[type="file"] {
    padding: 10px;
}

textarea {
    min-height: 120px;
    resize: vertical;
}

button {
    padding: 13px 20px;
    background: white;
    color: black;
    border: 0;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #ddd;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.delete {
    background: #300;
    color: white;
}

.upload-box {
    border: 1px dashed #555;
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 20px;
    background: #090909;
}

.upload-status {
    margin-top: 10px;
    color: #aaa;
}

.progress {
    width: 100%;
    height: 8px;
    background: #222;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 12px;
}

.progress-bar {
    width: 0%;
    height: 100%;
    background: white;
    transition: width .2s;
}

.content-list {
    display: grid;
    gap: 12px;
}

.content-item {
    background: #080808;
    border: 1px solid #292929;
    border-radius: 6px;
    padding: 18px;
    display: flex;
    align-items: center;
    gap: 15px;
}

.content-info {
    flex: 1;
}

.content-title {
    font-weight: bold;
    font-size: 18px;
}

.content-type {
    color: #888;
    margin-top: 5px;
}

#message {
    padding: 15px;
    border-radius: 5px;
    background: #181818;
    margin-bottom: 20px;
}

.success {
    color: #9cffb0;
}

.error {
    color: #ff9999;
}

</style>

</head>

<body>

<header>

<div class="logo">
HORIZON<span>270+</span>
</div>

<a
class="back"
href="profiles.html"

>

← Perfils </a>

</header>

<main>

<h1>
Panell d'administració
</h1>

<div
    id="message"
    hidden
></div>

<div class="panel">

<h2>
➕ Crear contingut
</h2>

<form id="contentForm">

<div class="grid">

<div>

<label>
Tipus
</label>

<select
id="content_type"
required

>

<option value="movie">
Pel·lícula
</option>

<option value="series">
Sèrie
</option>

</select>

</div>

<div>

<label>
Títol
</label>

<input
id="title"
type="text"
required
placeholder="Nom de la pel·lícula o sèrie"

>

</div>

<div>

<label>
Gènere
</label>

<input
id="genre"
type="text"
placeholder="Drama, acció, comèdia..."

>

</div>

<div>

<label>
Any
</label>

<input
id="release_year"
type="number"
min="1800"
max="2100"
placeholder="2026"

>

</div>

<div>

<label>
Durada (minuts)
</label>

<input
id="duration_minutes"
type="number"
min="1"
placeholder="120"

>

</div>

</div>

<label>
Descripció
</label>

<textarea
    id="description"
    placeholder="Descripció del contingut..."
></textarea>

<div class="grid">

<div>

<label>
URL de la portada
</label>

<input
id="thumbnail_url"
type="url"
placeholder="https://..."

>

</div>

<div>

<label>
URL del tràiler
</label>

<input
id="trailer_url"
type="url"
placeholder="https://..."

>

</div>

</div>

<!-- =========================
     PUJAR VÍDEO
========================= -->

<div class="upload-box">

<h3>
🎬 Fitxer de vídeo
</h3>

<p>
Selecciona el vídeo de la pel·lícula o sèrie.
</p>

<input
id="videoFile"
type="file"
accept="video/*"

>

<div
    id="fileInfo"
    class="upload-status"
>
Cap fitxer seleccionat.
</div>

<button
type="button"
id="uploadButton"
onclick="uploadVideo()"
disabled

>

⬆️ Pujar vídeo </button>

<div class="progress">

<div
    id="progressBar"
    class="progress-bar"
>
</div>

</div>

<div
    id="uploadStatus"
    class="upload-status"
>
</div>

<input
id="video_url"
type="hidden"

>

</div>

<div class="grid">

<div>

<label>
Data/hora d'estrena
</label>

<input
id="available_from"
type="datetime-local"

>

</div>

<div>

<label>
Disponible fins
</label>

<input
id="available_until"
type="datetime-local"

>

</div>

</div>

<label>

<input
id="is_featured"
type="checkbox"

>

Destacar a la portada

</label>

<label>

<input
id="is_published"
type="checkbox"

>

Publicar immediatament

</label>

<br>

<button
type="submit"

>

💾 Guardar contingut </button>

</form>

</div>

<!-- =========================
     CONTINGUT EXISTENT
========================= -->

<div class="panel">

<h2>
📚 Contingut existent
</h2>

<div
    id="contentList"
    class="content-list"
>

Carregant...

</div>

</div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>


const SUPABASE_URL =
"https://eftxwdpdweomffgurlgm.supabase.co";


const SUPABASE_KEY =
"sb_publishable_DPCJgsTp66cw2s-5S3CqNg_AdJEHKpt";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


const message =
document.getElementById(
    "message"
);


/* =========================
   MISSATGES
========================= */

function showMessage(
    text,
    success = false
) {

    message.textContent = text;

    message.className =
        success
        ? "success"
        : "error";

    message.hidden = false;

}


/* =========================
   COMPROVAR ADMIN
========================= */

async function checkAdmin() {

    const {
        data,
        error
    } =
    await supabaseClient.auth.getSession();


    if (
        error ||
        !data.session
    ) {

        window.location.replace(
            "login.html"
        );

        return false;

    }


    const user =
        data.session.user;


    const {
        data: profile,
        error: profileError
    } =
    await supabaseClient

    .from("Profiles")

    .select(
        "id, account_type"
    )

    .eq(
        "id",
        user.id
    )

    .maybeSingle();


    if (profileError) {

        console.error(
            profileError
        );

        showMessage(
            "No s'ha pogut comprovar el compte: " +
            profileError.message
        );

        return false;

    }


    if (
        !profile ||
        profile.account_type !== "admin"
    ) {

        document.body.innerHTML = `

            <main style="
                max-width:700px;
                margin:100px auto;
                padding:30px;
                text-align:center;
            ">

                <h1>
                    Accés restringit
                </h1>

                <p>
                    Aquest panell només està
                    disponible per a administradors.
                </p>

                <a
                    href="profiles.html"
                    style="color:white;"
                >
                    Tornar als perfils
                </a>

            </main>

        `;

        return false;

    }


    return true;

}


/* =========================
   SELECCIÓ DE FITXER
========================= */

document
.getElementById("videoFile")
.addEventListener(
    "change",
    function() {

        const file =
            this.files[0];

        const button =
            document.getElementById(
                "uploadButton"
            );

        const info =
            document.getElementById(
                "fileInfo"
            );


        if (!file) {

            button.disabled = true;

            info.textContent =
                "Cap fitxer seleccionat.";

            return;

        }


        const sizeGB =
            file.size /
            1024 /
            1024 /
            1024;


        info.textContent =
            file.name +
            " · " +
            sizeGB.toFixed(2) +
            " GB";


        button.disabled = false;

    }
);


/* =========================
   PUJAR VÍDEO
========================= */

async function uploadVideo() {

    const file =
        document
        .getElementById("videoFile")
        .files[0];


    if (!file) {

        return;

    }


    const status =
        document.getElementById(
            "uploadStatus"
        );


    const progress =
        document.getElementById(
            "progressBar"
        );


    const button =
        document.getElementById(
            "uploadButton"
        );


    button.disabled = true;


    status.textContent =
        "Preparant la pujada...";


    progress.style.width =
        "10%";


    try {

        const {
            data,
            error
        } =
        await supabaseClient.auth.getUser();


        if (
            error ||
            !data.user
        ) {

            throw new Error(
                "La sessió ha caducat."
            );

        }


        /*
         * Nom únic del fitxer
         */

        const extension =
            file.name.includes(".")
            ? file.name
                .split(".")
                .pop()
                .toLowerCase()
            : "mp4";


        const safeName =
            file.name
                .replace(
                    /[^a-zA-Z0-9._-]/g,
                    "_"
                );


        const filePath =
            data.user.id +
            "/" +
            Date.now() +
            "-" +
            safeName;


        status.textContent =
            "Pujant vídeo...";


        progress.style.width =
            "30%";


        const {
            error: uploadError
        } =
        await supabaseClient

        .storage

        .from("videos")

        .upload(
            filePath,
            file,
            {
                cacheControl:
                    "3600",

                upsert:
                    false,

                contentType:
                    file.type
            }
        );


        if (uploadError) {

            throw uploadError;

        }


        progress.style.width =
            "80%";


        /*
         * Obtenir URL pública
         */

        const {
            data: publicData
        } =
        supabaseClient

        .storage

        .from("videos")

        .getPublicUrl(
            filePath
        );


        const videoUrl =
            publicData.publicUrl;


        document
        .getElementById(
            "video_url"
        )
        .value =
            videoUrl;


        progress.style.width =
            "100%";


        status.textContent =
            "✅ Vídeo pujat correctament.";


        showMessage(
            "Vídeo pujat. Ara pots guardar el contingut.",
            true
        );


    }

    catch (error) {

        console.error(error);


        progress.style.width =
            "0%";


        status.textContent =
            "❌ Error: " +
            error.message;


        showMessage(
            "No s'ha pogut pujar el vídeo: " +
            error.message
        );

    }


    button.disabled = false;

}


/* =========================
   CREAR CONTINGUT
========================= */

document
.getElementById("contentForm")
.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const videoUrl =
            document
            .getElementById("video_url")
            .value;


        if (!videoUrl) {

            showMessage(
                "Primer has de seleccionar i pujar el vídeo."
            );

            return;

        }


        const content = {

            title:
                document
                .getElementById("title")
                .value
                .trim(),

            description:
                document
                .getElementById("description")
                .value
                .trim()
                || null,

            content_type:
                document
                .getElementById("content_type")
                .value,

            genre:
                document
                .getElementById("genre")
                .value
                .trim()
                || null,

            release_year:
                Number(
                    document
                    .getElementById("release_year")
                    .value
                )
                || null,

            duration_minutes:
                Number(
                    document
                    .getElementById("duration_minutes")
                    .value
                )
                || null,

            thumbnail_url:
                document
                .getElementById("thumbnail_url")
                .value
                .trim()
                || null,

            trailer_url:
                document
                .getElementById("trailer_url")
                .value
                .trim()
                || null,

            video_url:
                videoUrl,

            available_from:
                document
                .getElementById("available_from")
                .value
                || null,

            available_until:
                document
                .getElementById("available_until")
                .value
                || null,

            is_featured:
                document
                .getElementById("is_featured")
                .checked,

            is_published:
                document
                .getElementById("is_published")
                .checked

        };


        const {
            error
        } =
        await supabaseClient

        .from("Content")

        .insert(content);


        if (error) {

            console.error(error);

            showMessage(
                "Error guardant el contingut: " +
                error.message
            );

            return;

        }


        showMessage(
            "🎬 Contingut creat correctament.",
            true
        );


        document
        .getElementById("contentForm")
        .reset();


        document
        .getElementById("video_url")
        .value =
            "";


        document
        .getElementById("fileInfo")
        .textContent =
            "Cap fitxer seleccionat.";


        document
        .getElementById("uploadStatus")
        .textContent =
            "";


        document
        .getElementById("progressBar")
        .style.width =
            "0%";


        loadContent();

    }
);


/* =========================
   CARREGAR CONTINGUT
========================= */

async function loadContent() {

    const list =
        document.getElementById(
            "contentList"
        );


    const {
        data,
        error
    } =
    await supabaseClient

    .from("Content")

    .select("*")

    .order(
        "created_at",
        {
            ascending: false
        }
    );


    if (error) {

        list.textContent =
            "No s'ha pogut carregar el contingut.";

        console.error(error);

        return;

    }


    if (!data.length) {

        list.textContent =
            "Encara no hi ha contingut.";

        return;

    }


    list.innerHTML = "";


    data.forEach(
        item => {

            const element =
                document.createElement(
                    "div"
                );


            element.className =
                "content-item";


            element.innerHTML = `

                <div class="content-info">

                    <div class="content-title">
                        ${escapeHtml(
                            item.title
                        )}
                    </div>

                    <div class="content-type">

                        ${
                            item.content_type === "movie"
                            ? "🎬 Pel·lícula"
                            : "📺 Sèrie"
                        }

                        ·

                        ${
                            item.is_published
                            ? "Publicat"
                            : "No publicat"
                        }

                    </div>

                </div>

                <button
                    class="delete"
                    onclick="deleteContent('${item.id}')"
                >
                    🗑️
                </button>

            `;


            list.appendChild(
                element
            );

        }
    );

}


/* =========================
   ELIMINAR CONTINGUT
========================= */

async function deleteContent(id) {

    const confirmDelete =
        confirm(
            "Vols eliminar aquest contingut?"
        );


    if (!confirmDelete) {

        return;

    }


    const {
        error
    } =
    await supabaseClient

    .from("Content")

    .delete()

    .eq(
        "id",
        id
    );


    if (error) {

        showMessage(
            "No s'ha pogut eliminar: " +
            error.message
        );

        return;

    }


    showMessage(
        "Contingut eliminat.",
        true
    );


    loadContent();

}


/* =========================
   SEGURETAT HTML
========================= */

function escapeHtml(text) {

    return String(text)
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =========================
   INICI
========================= */

async function start() {

    const isAdmin =
        await checkAdmin();


    if (!isAdmin) {

        return;

    }


    loadContent();

}


start();

</script>

</body>

</html>
