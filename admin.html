<!DOCTYPE html>

<html lang="ca">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HORIZON270+ | Administració</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #050505;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

header {
    height: 70px;
    display: flex;
    align-items: center;
    padding: 0 5%;
    background: #080808;
    border-bottom: 1px solid #222;
}

.logo {
    font-size: 25px;
    font-weight: 900;
}

.logo span {
    color: #aaa;
}

.back {
    margin-left: auto;
    color: white;
    text-decoration: none;
    border: 1px solid #555;
    padding: 10px 16px;
    border-radius: 5px;
}

main {
    max-width: 1100px;
    margin: auto;
    padding: 40px 25px;
}

h1 {
    font-size: 38px;
}

.panel {
    background: #111;
    border: 1px solid #292929;
    border-radius: 8px;
    padding: 25px;
    margin-bottom: 25px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(
        auto-fit,
        minmax(220px, 1fr)
    );
    gap: 18px;
}

label {
    display: block;
    margin-bottom: 7px;
    color: #bbb;
}

input,
textarea,
select {
    width: 100%;
    padding: 13px;
    margin-bottom: 18px;
    background: #080808;
    color: white;
    border: 1px solid #444;
    border-radius: 5px;
    font-size: 15px;
}

input[type="checkbox"] {
    width: auto;
    margin-right: 8px;
}

input[type="file"] {
    padding: 10px;
}

textarea {
    min-height: 120px;
    resize: vertical;
}

button {
    padding: 13px 20px;
    background: white;
    color: black;
    border: 0;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #ddd;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.danger {
    background: #300;
    color: white;
}

.upload-box {
    border: 1px dashed #555;
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 20px;
    background: #090909;
}

.upload-status {
    margin-top: 10px;
    color: #aaa;
}

.progress {
    width: 100%;
    height: 10px;
    background: #222;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 15px;
}

.progress-bar {
    width: 0%;
    height: 100%;
    background: white;
    transition: width .2s;
}

.upload-controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 15px;
}

.content-list {
    display: grid;
    gap: 12px;
}

.content-item {
    background: #080808;
    border: 1px solid #292929;
    border-radius: 6px;
    padding: 18px;
    display: flex;
    align-items: center;
    gap: 15px;
}

.content-info {
    flex: 1;
}

.content-title {
    font-weight: bold;
    font-size: 18px;
}

.content-type {
    color: #888;
    margin-top: 5px;
}

#message {
    padding: 15px;
    border-radius: 5px;
    background: #181818;
    margin-bottom: 20px;
}

.success {
    color: #9cffb0;
}

.error {
    color: #ff9999;
}

</style>

</head>

<body>

<header>

<div class="logo">
HORIZON<span>270+</span>
</div>

<a
class="back"
href="profiles.html"

>

← Perfils </a>

</header>

<main>

<h1>
Panell d'administració
</h1>

<div
    id="message"
    hidden
></div>

<!-- =========================
     CREAR CONTINGUT
========================= -->

<div class="panel">

<h2>
➕ Crear contingut
</h2>

<form id="contentForm">

<div class="grid">

<div>

<label>
Tipus
</label>

<select
id="content_type"
required

>

<option value="movie">
Pel·lícula
</option>

<option value="series">
Sèrie
</option>

</select>

</div>

<div>

<label>
Títol
</label>

<input
id="title"
type="text"
required
placeholder="Nom de la pel·lícula o sèrie"

>

</div>

<div>

<label>
Gènere
</label>

<input
id="genre"
type="text"
placeholder="Drama, acció, comèdia..."

>

</div>

<div>

<label>
Any
</label>

<input
id="release_year"
type="number"
min="1800"
max="2100"
placeholder="2026"

>

</div>

<div>

<label>
Durada (minuts)
</label>

<input
id="duration_minutes"
type="number"
min="1"
placeholder="120"

>

</div>

</div>

<label>
Descripció
</label>

<textarea
    id="description"
    placeholder="Descripció del contingut..."
></textarea>

<div class="grid">

<div>

<label>
URL de la portada
</label>

<input
id="thumbnail_url"
type="url"
placeholder="https://..."

>

</div>

<div>

<label>
URL del tràiler
</label>

<input
id="trailer_url"
type="url"
placeholder="https://..."

>

</div>

</div>

<!-- =========================
     VIDEO
========================= -->

<div class="upload-box">

<h3>
🎬 Vídeo
</h3>

<p>
Selecciona el fitxer de vídeo que vols pujar.
</p>

<input
id="videoFile"
type="file"
accept="video/*"

>

<div
    id="fileInfo"
    class="upload-status"
>
Cap fitxer seleccionat.
</div>

<div class="upload-controls">

<button
type="button"
id="uploadButton"
onclick="startUpload()"
disabled

>

⬆️ Pujar vídeo </button>

<button
type="button"
id="pauseButton"
onclick="pauseUpload()"
disabled

>

⏸️ Pausar </button>

<button
type="button"
id="resumeButton"
onclick="resumeUpload()"
disabled

>

▶️ Continuar </button>

</div>

<div class="progress">

<div
    id="progressBar"
    class="progress-bar"
>
</div>

</div>

<div
    id="uploadStatus"
    class="upload-status"
>
</div>

<input
id="video_url"
type="hidden"

>

</div>

<div class="grid">

<div>

<label>
Data/hora d'estrena
</label>

<input
id="available_from"
type="datetime-local"

>

</div>

<div>

<label>
Disponible fins
</label>

<input
id="available_until"
type="datetime-local"

>

</div>

</div>

<label>

<input
id="is_featured"
type="checkbox"

>

Destacar a la portada

</label>

<label>

<input
id="is_published"
type="checkbox"

>

Publicar immediatament

</label>

<br>

<button
type="submit"

>

💾 Guardar contingut </button>

</form>

</div>

<!-- =========================
     CONTINGUT EXISTENT
========================= -->

<div class="panel">

<h2>
📚 Contingut existent
</h2>

<div
    id="contentList"
    class="content-list"
>

Carregant...

</div>

</div>

</main>

<!-- =========================
     SUPABASE
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- TUS -->

<script src="https://cdn.jsdelivr.net/npm/tus-js-client@4.1.0/dist/tus.min.js"></script>

<script>


const SUPABASE_URL =
"https://eftxwdpdweomffgurlgm.supabase.co";


const SUPABASE_KEY =
"sb_publishable_DPCJgsTp66cw2s-5S3CqNg_AdJEHKpt";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


let upload = null;

let selectedFile = null;


/* =========================
   MISSATGES
========================= */

function showMessage(
    text,
    success = false
) {

    const message =
        document.getElementById(
            "message"
        );

    message.textContent =
        text;

    message.className =
        success
        ? "success"
        : "error";

    message.hidden = false;

}


/* =========================
   COMPROVAR ADMIN
========================= */

async function checkAdmin() {

    const {
        data,
        error
    } =
    await supabaseClient.auth.getSession();


    if (
        error ||
        !data.session
    ) {

        window.location.replace(
            "login.html"
        );

        return false;

    }


    const user =
        data.session.user;


    const {
        data: profile,
        error: profileError
    } =
    await supabaseClient

    .from("Profiles")

    .select(
        "id, account_type"
    )

    .eq(
        "id",
        user.id
    )

    .maybeSingle();


    if (profileError) {

        console.error(
            profileError
        );

        showMessage(
            "No s'ha pogut comprovar el compte: " +
            profileError.message
        );

        return false;

    }


    if (
        !profile ||
        profile.account_type !== "admin"
    ) {

        document.body.innerHTML = `

            <main style="
                max-width:700px;
                margin:100px auto;
                padding:30px;
                text-align:center;
            ">

                <h1>
                    Accés restringit
                </h1>

                <p>
                    Aquest panell només està
                    disponible per a administradors.
                </p>

                <a
                    href="profiles.html"
                    style="color:white;"
                >
                    Tornar als perfils
                </a>

            </main>

        `;

        return false;

    }


    return true;

}


/* =========================
   SELECCIONAR FITXER
========================= */

document
.getElementById("videoFile")
.addEventListener(
    "change",
    function() {

        selectedFile =
            this.files[0] || null;


        const info =
            document.getElementById(
                "fileInfo"
            );

        const button =
            document.getElementById(
                "uploadButton"
            );


        if (!selectedFile) {

            info.textContent =
                "Cap fitxer seleccionat.";

            button.disabled =
                true;

            return;

        }


        const sizeGB =
            selectedFile.size /
            1024 /
            1024 /
            1024;


        info.textContent =
            selectedFile.name +
            " · " +
            sizeGB.toFixed(2) +
            " GB";


        button.disabled =
            false;


        document
        .getElementById(
            "uploadStatus"
        )
        .textContent =
            "Preparat per pujar.";

    }
);


/* =========================
   INICIAR TUS
========================= */

async function startUpload() {

    if (!selectedFile) {

        return;

    }


    const {
        data,
        error
    } =
    await supabaseClient.auth.getSession();


    if (
        error ||
        !data.session
    ) {

        showMessage(
            "La sessió ha caducat."
        );

        return;

    }


    const user =
        data.session.user;


    const uploadButton =
        document.getElementById(
            "uploadButton"
        );

    const pauseButton =
        document.getElementById(
            "pauseButton"
        );

    const resumeButton =
        document.getElementById(
            "resumeButton"
        );

    const status =
        document.getElementById(
            "uploadStatus"
        );

    const progressBar =
        document.getElementById(
            "progressBar"
        );


    uploadButton.disabled =
        true;

    pauseButton.disabled =
        false;

    resumeButton.disabled =
        true;


    const safeName =
        selectedFile.name
        .replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
        );


    const filePath =
        user.id +
        "/" +
        Date.now() +
        "-" +
        safeName;


    const {
        data: sessionData
    } =
    await supabaseClient.auth.getSession();


    const accessToken =
        sessionData
        .session
        .access_token;


    status.textContent =
        "Iniciant pujada resumible...";


    upload =
        new tus.Upload(
            selectedFile,
            {

                endpoint:
                    SUPABASE_URL +
                    "/storage/v1/upload/resumable",

                retryDelays:
                    [
                        0,
                        3000,
                        5000,
                        10000,
                        20000
                    ],

                headers: {

                    authorization:
                        "Bearer " +
                        accessToken,

                    "x-upsert":
                        "false"

                },

                uploadDataDuringCreation:
                    true,

                removeFingerprintOnSuccess:
                    true,

                metadata: {

                    bucketName:
                        "videos",

                    objectName:
                        filePath,

                    contentType:
                        selectedFile.type ||
                        "video/mp4",

                    cacheControl:
                        "3600"

                },

                chunkSize:
                    6 * 1024 * 1024,


                onError:
                    function(error) {

                        console.error(
                            error
                        );

                        status.textContent =
                            "❌ Error: " +
                            error.message;

                        pauseButton.disabled =
                            true;

                        resumeButton.disabled =
                            false;

                    },


                onProgress:
                    function(
                        bytesUploaded,
                        bytesTotal
                    ) {

                        const percentage =
                            (
                                bytesUploaded /
                                bytesTotal
                            ) * 100;


                        progressBar.style.width =
                            percentage +
                            "%";


                        const uploadedGB =
                            bytesUploaded /
                            1024 /
                            1024 /
                            1024;


                        const totalGB =
                            bytesTotal /
                            1024 /
                            1024 /
                            1024;


                        status.textContent =
                            percentage.toFixed(1) +
                            "% · " +
                            uploadedGB.toFixed(2) +
                            " GB / " +
                            totalGB.toFixed(2) +
                            " GB";

                    },


                onSuccess:
                    function() {

                        const videoUrl =
                            SUPABASE_URL +
                            "/storage/v1/object/public/videos/" +
                            filePath;


                        document
                        .getElementById(
                            "video_url"
                        )
                        .value =
                            videoUrl;


                        status.textContent =
                            "✅ Vídeo pujat correctament.";

                        showMessage(
                            "Vídeo pujat. Ara pots guardar el contingut.",
                            true
                        );


                        pauseButton.disabled =
                            true;

                        resumeButton.disabled =
                            true;

                        uploadButton.disabled =
                            true;

                    }

            }
        );


    /*
     * Intentar reprendre una pujada
     * anterior del mateix fitxer.
     */

    const previousUploads =
        await upload.findPreviousUploads();


    if (
        previousUploads &&
        previousUploads.length
    ) {

        upload.resumeFromPreviousUpload(
            previousUploads[0]
        );

    }


    upload.start();

}


/* =========================
   PAUSAR
========================= */

function pauseUpload() {

    if (!upload) {

        return;

    }


    upload.abort();


    document
    .getElementById(
        "uploadStatus"
    )
    .textContent =
        "⏸️ Pujada pausada.";


    document
    .getElementById(
        "pauseButton"
    )
    .disabled =
        true;


    document
    .getElementById(
        "resumeButton"
    )
    .disabled =
        false;

}


/* =========================
   CONTINUAR
========================= */

function resumeUpload() {

    if (!upload) {

        return;

    }


    document
    .getElementById(
        "pauseButton"
    )
    .disabled =
        false;


    document
    .getElementById(
        "resumeButton"
    )
    .disabled =
        true;


    document
    .getElementById(
        "uploadStatus"
    )
    .textContent =
        "▶️ Continuant la pujada...";


    upload.start();

}


/* =========================
   CREAR CONTINGUT
========================= */

document
.getElementById("contentForm")
.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const videoUrl =
            document
            .getElementById(
                "video_url"
            )
            .value;


        if (!videoUrl) {

            showMessage(
                "Primer has de pujar el vídeo."
            );

            return;

        }


        const content = {

            title:
                document
                .getElementById("title")
                .value
                .trim(),

            description:
                document
                .getElementById("description")
                .value
                .trim()
                || null,

            content_type:
                document
                .getElementById("content_type")
                .value,

            genre:
                document
                .getElementById("genre")
                .value
                .trim()
                || null,

            release_year:
                Number(
                    document
                    .getElementById(
                        "release_year"
                    )
                    .value
                )
                || null,

            duration_minutes:
                Number(
                    document
                    .getElementById(
                        "duration_minutes"
                    )
                    .value
                )
                || null,

            thumbnail_url:
                document
                .getElementById(
                    "thumbnail_url"
                )
                .value
                .trim()
                || null,

            trailer_url:
                document
                .getElementById(
                    "trailer_url"
                )
                .value
                .trim()
                || null,

            video_url:
                videoUrl,

            available_from:
                document
                .getElementById(
                    "available_from"
                )
                .value
                || null,

            available_until:
                document
                .getElementById(
                    "available_until"
                )
                .value
                || null,

            is_featured:
                document
                .getElementById(
                    "is_featured"
                )
                .checked,

            is_published:
                document
                .getElementById(
                    "is_published"
                )
                .checked

        };


        const {
            error
        } =
        await supabaseClient

        .from("Content")

        .insert(
            content
        );


        if (error) {

            console.error(
                error
            );

            showMessage(
                "Error guardant el contingut: " +
                error.message
            );

            return;

        }


        showMessage(
            "🎬 Contingut creat correctament.",
            true
        );


        document
        .getElementById(
            "contentForm"
        )
        .reset();


        document
        .getElementById(
            "video_url"
        )
        .value =
            "";


        selectedFile =
            null;


        document
        .getElementById(
            "fileInfo"
        )
        .textContent =
            "Cap fitxer seleccionat.";


        document
        .getElementById(
            "uploadStatus"
        )
        .textContent =
            "";


        document
        .getElementById(
            "progressBar"
        )
        .style.width =
            "0%";


        loadContent();

    }
);


/* =========================
   CARREGAR CONTINGUT
========================= */

async function loadContent() {

    const list =
        document.getElementById(
            "contentList"
        );


    const {
        data,
        error
    } =
    await supabaseClient

    .from("Content")

    .select("*")

    .order(
        "created_at",
        {
            ascending: false
        }
    );


    if (error) {

        list.textContent =
            "No s'ha pogut carregar el contingut.";

        console.error(
            error
        );

        return;

    }


    if (!data.length) {

        list.textContent =
            "Encara no hi ha contingut.";

        return;

    }


    list.innerHTML =
        "";


    data.forEach(
        item => {

            const element =
                document.createElement(
                    "div"
                );


            element.className =
                "content-item";


            element.innerHTML = `

                <div class="content-info">

                    <div class="content-title">
                        ${escapeHtml(
                            item.title
                        )}
                    </div>

                    <div class="content-type">

                        ${
                            item.content_type === "movie"
                            ? "🎬 Pel·lícula"
                            : "📺 Sèrie"
                        }

                        ·

                        ${
                            item.is_published
                            ? "Publicat"
                            : "No publicat"
                        }

                    </div>

                </div>

                <button
                    class="danger"
                    onclick="deleteContent('${item.id}')"
                >
                    🗑️
                </button>

            `;


            list.appendChild(
                element
            );

        }
    );

}


/* =========================
   ELIMINAR
========================= */

async function deleteContent(id) {

    if (
        !confirm(
            "Vols eliminar aquest contingut?"
        )
    ) {

        return;

    }


    const {
        error
    } =
    await supabaseClient

    .from("Content")

    .delete()

    .eq(
        "id",
        id
    );


    if (error) {

        showMessage(
            "No s'ha pogut eliminar: " +
            error.message
        );

        return;

    }


    showMessage(
        "Contingut eliminat.",
        true
    );


    loadContent();

}


/* =========================
   ESCAPAR HTML
========================= */

function escapeHtml(text) {

    return String(text)
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =========================
   INICI
========================= */

async function start() {

    const isAdmin =
        await checkAdmin();


    if (!isAdmin) {

        return;

    }


    loadContent();

}


start();

</script>

</body>

</html>
