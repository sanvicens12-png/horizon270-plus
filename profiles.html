<!DOCTYPE html>

<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HORIZON270+ | Perfils</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    min-height:100vh;
    background:#050505;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
}
.container{text-align:center}
h1{font-size:35px}
.profiles{
    display:flex;
    gap:30px;
    justify-content:center;
    flex-wrap:wrap;
    margin-top:40px;
}
.profile{
    width:160px;
    cursor:pointer;
}
.avatar{
    width:140px;
    height:140px;
    margin:auto;
    border-radius:8px;
    background:linear-gradient(135deg,#333,#111);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:55px;
    border:3px solid transparent;
}
.profile:hover .avatar{
    border-color:white;
}
.name{
    margin-top:12px;
    color:#bbb;
}
button{
    margin-top:40px;
    padding:12px 20px;
    background:#111;
    border:1px solid #555;
    color:white;
    border-radius:5px;
    cursor:pointer;
}
</style>

</head>

<body>

<div class="container">

<h1>Qui està mirant?</h1>

<div class="profiles">

<div
    class="profile"
    onclick="enter()"
>
<div class="avatar">👤</div>
<div class="name">Principal</div>
</div>

</div>

<button onclick="logout()">
Tancar sessió
</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabaseClient =
window.supabase.createClient(
    "https://eftxwdpdweomffgurlgm.supabase.co",
    "sb_publishable_DPCJgsTp66cw2s-5S3CqNg_AdJEHKpt"
);

async function check(){

    const {data}=await supabaseClient.auth.getSession();

    if(!data.session){

        window.location.replace("login.html");

    }

}

check();

function enter(){

    window.location.replace(
        "catalog.html"
    );

}

async function logout(){

    await supabaseClient.auth.signOut();

    window.location.replace(
        "index.html"
    );

}

</script>

</body>
</html>
