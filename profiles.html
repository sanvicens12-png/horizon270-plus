<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>


const SUPABASE_URL =
"https://eftxwdpdweomffgurlgm.supabase.co";


const SUPABASE_KEY =
"sb_publishable_DPCJgsTp66cw2s-5S3CqNg_AdJEHKpt";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   CARREGAR PERFIL
========================= */

async function start() {

    try {

        const {
            data: sessionData,
            error: sessionError
        } =
        await supabaseClient.auth.getSession();


        if (sessionError) {

            throw sessionError;

        }


        /*
         * COMPROVAR LOGIN
         */

        if (!sessionData.session) {

            window.location.replace(
                "login.html"
            );

            return;

        }


        const user =
            sessionData.session.user;


        /*
         * BUSCAR EL PERFIL A
         * public."Profiles"
         */

        const {
            data: profile,
            error: profileError
        } =
        await supabaseClient

        .from("Profiles")

        .select(
            "id, username, account_type, created_at"
        )

        .eq(
            "id",
            user.id
        )

        .maybeSingle();


        if (profileError) {

            console.error(
                "Error carregant Profiles:",
                profileError
            );

        }


        /*
         * NOM DEL PERFIL
         */

        if (
            profile &&
            profile.username
        ) {

            document.getElementById(
                "profileName"
            ).textContent =
                profile.username;

        }


        /*
         * ADMIN
         */

        if (
            profile &&
            profile.account_type === "admin"
        ) {

            document.getElementById(
                "adminArea"
            ).hidden = false;

        }


        /*
         * MOSTRAR PÀGINA
         */

        document.getElementById(
            "loading"
        ).hidden = true;

        document.getElementById(
            "content"
        ).hidden = false;

    }

    catch (error) {

        console.error(error);


        document.getElementById(
            "loading"
        ).hidden = true;


        document.getElementById(
            "error"
        ).textContent =
            "No s'ha pogut carregar el compte.";


        document.getElementById(
            "error"
        ).hidden = false;

    }

}


/* =========================
   CATÀLEG
========================= */

function enterCatalog() {

    window.location.replace(
        "catalog.html"
    );

}


/* =========================
   LOGOUT
========================= */

async function logout() {

    await supabaseClient.auth.signOut();

    window.location.replace(
        "index.html"
    );

}


start();

</script>
