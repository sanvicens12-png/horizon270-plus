        margin: auto;

        font-size: 65px;

        border: 3px solid transparent;

        transition:

            border-color .2s;

    }


    .profile:hover .avatar {

        border-color: white;

    }


    .profile-name {

        display: block;

        margin-top: 14px;

        color: #bbb;

    .profile:hover .profile-name {

        color: white;

    }


    /* =========================

    .add-profile .avatar {

        border: 2px solid #444;

        color: #aaa;

        font-size: 65px;

    }


    .add-profile:hover .avatar {

        background: #222;

        color: white;

        border-color: white;

    /* =========================
       MODAL
    ========================= */

    .modal {

        position: fixed;

        inset: 0;

        display: none;

        align-items: center;

        justify-content: center;

        padding: 20px;

    .modal.open {

        display: flex;

    .modal-card {

    .field {

        margin-bottom: 18px;

    }


    .field label {

        display: block;

        margin-bottom: 8px;

        color: #ccc;

    }


    .field input {

        width: 100%;

        padding: 13px;

        border-radius: 5px;

        border: 1px solid #555;

        background: #080808;

        color: white;

        font-size: 16px;

    }

        flex-wrap: wrap;

    }

        border: 2px solid #444;

        color: white;

        font-size: 24px;

        cursor: pointer;

    }


    .avatar-option.selected {

        border-color: white;

    }

    /* =========================

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://eftxwdpdweomffgurlgm.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_DPCJgsTp66cw2s-5S3CqNg_AdJEHKpt";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================
   ELEMENTS
========================= */

const profilesContainer =
    document.getElementById(
        "profiles"
    );


const message =
    document.getElementById(
        "message"
    );


const modal =
    document.getElementById(
        "profileModal"
    );


const profileName =
    document.getElementById(
        "profileName"
    );


const createButton =
    document.getElementById(
        "createButton"
    );


const cancelButton =
    document.getElementById(
        "cancelButton"
    );


const logoutButton =
    document.getElementById(
        "logoutButton"
    );


let selectedAvatar = "😀";


let currentUser = null;


/* =========================
   MESSAGE
========================= */

function showMessage(
    text,
    type = ""
) {

    message.textContent = text;

    message.className =
        "message " + type;

    message.hidden = false;

}


function hideMessage() {

    message.hidden = true;

    message.textContent = "";

}


/* =========================
   SESSION
========================= */

async function checkSession() {

    const {
        data,
        error
    } =
        await supabaseClient.auth.getSession();


    if (error) {

        console.error(error);

        showMessage(
            "No s'ha pogut comprovar la sessió.",
            "error"
        );

        return;

    }


    if (!data.session) {

        window.location.href =
            "login.html";

        return;

    }


    currentUser =
        data.session.user;


    await loadProfiles();

}


/* =========================
   LOAD PROFILES
========================= */

async function loadProfiles() {

    profilesContainer.innerHTML =
        "";


    const {
        data,
        error
    } =
        await supabaseClient
            .from("profiles")
            .select("*")
            .eq(
                "user_id",
                currentUser.id
            )
            .order(
                "created_at",
                {
                    ascending: true
                }
            );


    if (error) {

        console.error(error);

        /*
         * Si la taula encara no existeix,
         * ho indiquem sense trencar la pàgina.
         */

        showMessage(
            "La configuració dels perfils encara no està preparada a Supabase.",
            "error"
        );

        renderAddProfile();

        return;

    }


    hideMessage();


    if (data && data.length > 0) {

        data.forEach(
            profile => {

                renderProfile(
                    profile
                );

            }
        );

    }


    renderAddProfile();

}


/* =========================
   RENDER PROFILE
========================= */

function renderProfile(profile) {

    const button =
        document.createElement(
            "button"
        );


    button.className =
        "profile";


    button.type =
        "button";


    button.innerHTML = `

        <span class="avatar">
            ${escapeHtml(
                profile.avatar || "😀"
            )}
        </span>

        <span class="profile-name">
            ${escapeHtml(
                profile.name
            )}
        </span>

    `;


    button.addEventListener(
        "click",
        function() {

            entrarAlPerfil(
                profile
            );

        }
    );


    profilesContainer.appendChild(
        button
    );

}


/* =========================
   ADD PROFILE
========================= */

function renderAddProfile() {

    const button =
        document.createElement(
            "button"
        );


    button.className =
        "profile add-profile";


    button.type =
        "button";


    button.innerHTML = `

        <span class="avatar">
            +
        </span>

        <span class="profile-name">
            Afegir perfil
        </span>

    `;


    button.addEventListener(
        "click",
        openModal
    );


    profilesContainer.appendChild(
        button
    );

}


/* =========================
   OPEN MODAL
========================= */

function openModal() {

    profileName.value =
        "";


    selectedAvatar =
        "😀";


    document
        .querySelectorAll(
            ".avatar-option"
        )
        .forEach(
            button => {

                button.classList.toggle(
                    "selected",
                    button.dataset.avatar === "😀"
                );

            }
        );


    modal.classList.add(
        "open"
    );


    profileName.focus();

}


/* =========================
   CLOSE MODAL
========================= */

function closeModal() {

    modal.classList.remove(
        "open"
    );

}


/* =========================
   AVATAR SELECTION
========================= */

document
    .querySelectorAll(
        ".avatar-option"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                function() {

                    selectedAvatar =
                        this.dataset.avatar;


                    document
                        .querySelectorAll(
                            ".avatar-option"
                        )
                        .forEach(
                            item => {

                                item.classList.remove(
                                    "selected"
                                );

                            }
                        );


                    this.classList.add(
                        "selected"
                    );

                }
            );

        }
    );


/* =========================
   CREATE PROFILE
========================= */

createButton.addEventListener(
    "click",
    async function() {

        const name =
            profileName.value.trim();


        if (!name) {

            alert(
                "Escriu un nom per al perfil."
            );

            profileName.focus();

            return;

        }


        createButton.disabled =
            true;

        createButton.textContent =
            "Creant...";


        try {

            const {
                error
            } =
                await supabaseClient
                    .from("profiles")
                    .insert({

                        user_id:
                            currentUser.id,

                        name:
                            name,

                        avatar:
                            selectedAvatar

                    });


            if (error) {
                throw error;
            }


            closeModal();


            await loadProfiles();


        }

        catch (error) {

            console.error(error);

            showMessage(
                "No s'ha pogut crear el perfil.",
                "error"
            );

        }

        finally {

            createButton.disabled =
                false;

            createButton.textContent =
                "Crear perfil";

        }

    }
);


/* =========================
   ENTER PROFILE
========================= */

function entrarAlPerfil(profile) {

    /*
     * Guardem temporalment el perfil
     * seleccionat per utilitzar-lo
     * al catàleg.
     */

    localStorage.setItem(
        "horizon270_selected_profile",
        JSON.stringify(profile)
    );


    window.location.href =
        "catalog.html";

}


/* =========================
   LOGOUT
========================= */

logoutButton.addEventListener(
    "click",
    async function() {

        await supabaseClient.auth.signOut();

        localStorage.removeItem(
            "horizon270_selected_profile"
        );

        window.location.href =
            "login.html";

    }
);


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================
   CLOSE MODAL OUTSIDE
========================= */

modal.addEventListener(
    "click",
    function(event) {

        if (
            event.target === modal
        ) {

            closeModal();

        }

    }
);


cancelButton.addEventListener(
    "click",
    closeModal
);


/* =========================
   START
========================= */

checkSession();


</script>

</body>
