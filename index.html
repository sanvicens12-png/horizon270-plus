        header {

            background: white;
            color: black;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
        }

        section {
            padding: 30px 40px;
        }

        section h2 {
            font-size: 24px;
        }

        .row {
            display: flex;
            gap: 18px;
            overflow-x: auto;
        }

        .card {
            min-width: 180px;
            height: 260px;
            background: #171717;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #777;
        }

        footer {
            padding: 40px;
            color: #777;
            text-align: center;
        }

</head>
