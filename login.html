```

<section class="auth-card">

    <div class="auth-header">

        <span class="section-label">
            HORIZON270+

        <h1 id="authTitle">
            Inicia sessió

            <input
                type="email"
                id="email"
                placeholder="tu@exemple.com"
                autocomplete="email"
                required
            >

        </div>

        <div class="auth-field">

            <div class="password-label">

                <label for="password">

            <div class="password-input">

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://eftxwdpdweomffgurlgm.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_DPCJgsTp66cw2s-5S3CqNg_AdJEHKpt";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const authForm =
    document.getElementById("authForm");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const emailButton =
    document.getElementById("emailButton");

const googleButton =
    document.getElementById("googleButton");

const togglePassword =
    document.getElementById("togglePassword");

const forgotPassword =
    document.getElementById("forgotPassword");

const switchMode =
    document.getElementById("switchMode");

const switchText =
    document.getElementById("switchText");

const authTitle =
    document.getElementById("authTitle");

const authSubtitle =
    document.getElementById("authSubtitle");

const authMessage =
    document.getElementById("authMessage");


let isRegisterMode = false;


/* =========================
   MISSATGES
========================= */

function showMessage(message, type = "error") {

    authMessage.textContent = message;

    authMessage.className =
        "auth-message " + type;

    authMessage.hidden = false;
}


function hideMessage() {

    authMessage.hidden = true;

    authMessage.textContent = "";
}


/* =========================
   LOGIN / REGISTRE
========================= */

switchMode.addEventListener(
    "click",
    function () {

        isRegisterMode =
            !isRegisterMode;

        hideMessage();

        if (isRegisterMode) {

            authTitle.textContent =
                "Crea el teu compte";

            authSubtitle.textContent =
                "Uneix-te a HORIZON270+ i comença a explorar.";

            emailButton.textContent =
                "Crear compte";

            switchText.textContent =
                "Ja tens un compte?";

            switchMode.textContent =
                "Iniciar sessió";

            passwordInput.autocomplete =
                "new-password";

        } else {

            authTitle.textContent =
                "Inicia sessió";

            authSubtitle.textContent =
                "Accedeix al teu compte per continuar.";

            emailButton.textContent =
                "Iniciar sessió";

            switchText.textContent =
                "No tens compte?";

            switchMode.textContent =
                "Crear compte";

            passwordInput.autocomplete =
                "current-password";
        }
    }
);


/* =========================
   MOSTRAR CONTRASENYA
========================= */

togglePassword.addEventListener(
    "click",
    function () {

        const visible =
            passwordInput.type === "text";

        passwordInput.type =
            visible
            ? "password"
            : "text";

        togglePassword.textContent =
            visible
            ? "👁"
            : "🙈";
    }
);


/* =========================
   OBTENIR PERFIL
========================= */

async function obtenirPerfil(userId) {

    const {
        data,
        error
    } =
        await supabaseClient
            .from("Profiles")
            .select("account_type")
            .eq("id", userId)
            .maybeSingle();

    if (error) {

        console.error(
            "Profile error:",
            error
        );

        return null;
    }

    return data;
}


/* =========================
   REDIRECCIÓ SEGONS COMPTE
========================= */

async function redirigirSegonsCompte(userId) {

    const profile =
        await obtenirPerfil(userId);

    if (!profile) {

        window.location.href =
            "index.html";

        return;
    }


    const accountType =
        profile.account_type;


    if (accountType === "admin") {

        window.location.href =
            "admin.html";

        return;
    }


    if (accountType === "creator") {

        window.location.href =
            "creator.html";

        return;
    }


    window.location.href =
        "index.html";
}


/* =========================
   EMAIL AUTH
========================= */

authForm.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();

        hideMessage();

        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;


        if (!email || !password) {

            showMessage(
                "Introdueix el correu i la contrasenya."
            );

            return;
        }


        emailButton.disabled = true;

        emailButton.textContent =
            isRegisterMode
            ? "Creant compte..."
            : "Iniciant sessió...";


        try {

            if (isRegisterMode) {

                const {
                    data,
                    error
                } =
                    await supabaseClient.auth.signUp({

                        email,
                        password

                    });


                if (error) {
                    throw error;
                }


                if (
                    data.user &&
                    !data.session
                ) {

                    showMessage(
                        "Compte creat. Revisa el teu correu per confirmar el compte.",
                        "success"
                    );

                } else if (data.user) {

                    window.location.href =
                        "index.html";
                }

            } else {

                const {
                    data,
                    error
                } =
                    await supabaseClient.auth.signInWithPassword({

                        email,
                        password

                    });


                if (error) {
                    throw error;
                }


                if (data.user) {

                    await redirigirSegonsCompte(
                        data.user.id
                    );
                }
            }

        }

        catch (error) {

            console.error(
                "Authentication error:",
                error
            );

            showMessage(
                convertirError(error)
            );

        }

        finally {

            emailButton.disabled =
                false;

            emailButton.textContent =
                isRegisterMode
                ? "Crear compte"
                : "Iniciar sessió";
        }
    }
);


/* =========================
   GOOGLE
========================= */

googleButton.addEventListener(
    "click",
    async function () {

        hideMessage();

        googleButton.disabled =
            true;

        googleButton.classList.add(
            "loading"
        );


        try {

            const {
                error
            } =
                await supabaseClient.auth.signInWithOAuth({

                    provider: "google",

                    options: {

                        redirectTo:
                            window.location.origin +
                            "/login.html"

                    }

                });


            if (error) {
                throw error;
            }

        }

        catch (error) {

            console.error(
                "Google login error:",
                error
            );

            showMessage(
                "No s'ha pogut iniciar sessió amb Google."
            );

            googleButton.disabled =
                false;

            googleButton.classList.remove(
                "loading"
            );
        }
    }
);


/* =========================
   RECUPERAR CONTRASENYA
========================= */

forgotPassword.addEventListener(
    "click",
    async function () {

        hideMessage();

        const email =
            emailInput.value.trim();


        if (!email) {

            showMessage(
                "Escriu primer el teu correu electrònic."
            );

            emailInput.focus();

            return;
        }


        forgotPassword.disabled =
            true;


        try {

            const {
                error
            } =
                await supabaseClient.auth
                    .resetPasswordForEmail(
                        email,
                        {
                            redirectTo:
                                window.location.origin +
                                "/reset-password.html"
                        }
                    );


            if (error) {
                throw error;
            }


            showMessage(
                "T'hem enviat un correu per recuperar la contrasenya.",
                "success"
            );

        }

        catch (error) {

            console.error(
                "Password reset error:",
                error
            );

            showMessage(
                convertirError(error)
            );

        }

        finally {

            forgotPassword.disabled =
                false;
        }
    }
);


/* =========================
   ERRORS
========================= */

function convertirError(error) {

    const message =
        error?.message || "";


    if (
        message.includes(
            "Invalid login credentials"
        )
    ) {

        return "El correu o la contrasenya no són correctes.";
    }


    if (
        message.includes(
            "User already registered"
        )
    ) {

        return "Aquest correu ja té un compte.";
    }


    if (
        message.includes(
            "Password should be at least"
        )
    ) {

        return "La contrasenya és massa curta.";
    }


    if (
        message.includes(
            "Email not confirmed"
        )
    ) {

        return "Has de confirmar el teu correu electrònic abans d'iniciar sessió.";
    }


    return message ||
        "S'ha produït un error. Torna-ho a provar.";
}


/* =========================
   COMPROVAR SESSIÓ
========================= */

async function comprovarSessio() {

    const {
        data
    } =
        await supabaseClient.auth.getSession();


    if (data.session) {

        await redirigirSegonsCompte(
            data.session.user.id
        );
    }
}


comprovarSessio();

</script>

</body>
</html>
