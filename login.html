<section class="auth-card">

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://eftxwdpdweomffgurlgm.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_DPCJgsTp66cw2s-5S3CqNg_AdJEHKpt";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================
   GITHUB PAGES
========================= */

const BASE_PATH =
    "/horizon270-plus/";


const INDEX_URL =
    window.location.origin +
    BASE_PATH +
    "index.html";


const ADMIN_URL =
    window.location.origin +
    BASE_PATH +
    "admin.html";


const RESET_URL =
    window.location.origin +
    BASE_PATH +
    "reset-password.html";


/* =========================
   ELEMENTS
========================= */

const authForm =
    document.getElementById("authForm");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const emailButton =
    document.getElementById("emailButton");

const googleButton =
    document.getElementById("googleButton");

const togglePassword =
    document.getElementById("togglePassword");

const forgotPassword =
    document.getElementById("forgotPassword");

const switchMode =
    document.getElementById("switchMode");

const switchText =
    document.getElementById("switchText");

const authTitle =
    document.getElementById("authTitle");

const authSubtitle =
    document.getElementById("authSubtitle");

const authMessage =
    document.getElementById("authMessage");


let isRegisterMode = false;


/* =========================
   MESSAGE
========================= */

function showMessage(
    message,
    type = "error"
) {

    authMessage.textContent =
        message;

    authMessage.className =
        "auth-message " + type;

    authMessage.hidden =
        false;

}


function hideMessage() {

    authMessage.hidden =
        true;

    authMessage.textContent =
        "";

}


/* =========================
   DESTINACIÓ DESPRÉS DEL LOGIN
========================= */

async function anarDespresLogin() {

    const {
        data,
        error
    } =
        await supabaseClient
            .from("Profiles")
            .select("account_type")
            .eq("id", (await supabaseClient.auth.getUser()).data.user.id)
            .maybeSingle();


    if (error) {

        console.error(
            "Profile error:",
            error
        );

        window.location.href =
            INDEX_URL;

        return;
    }


    if (
        data &&
        data.account_type === "admin"
    ) {

        window.location.href =
            ADMIN_URL;

        return;
    }


    window.location.href =
        INDEX_URL;

}


/* =========================
   LOGIN / REGISTER
========================= */

switchMode.addEventListener(
    "click",
    function () {

        isRegisterMode =
            !isRegisterMode;

        hideMessage();


        if (isRegisterMode) {

            authTitle.textContent =
                "Crea el teu compte";

            authSubtitle.textContent =
                "Uneix-te a HORIZON270+ i comença a explorar.";

            emailButton.textContent =
                "Crear compte";

            switchText.textContent =
                "Ja tens un compte?";

            switchMode.textContent =
                "Iniciar sessió";

            passwordInput.autocomplete =
                "new-password";

        }

        else {

            authTitle.textContent =
                "Inicia sessió";

            authSubtitle.textContent =
                "Accedeix al teu compte per continuar.";

            emailButton.textContent =
                "Iniciar sessió";

            switchText.textContent =
                "No tens compte?";

            switchMode.textContent =
                "Crear compte";

            passwordInput.autocomplete =
                "current-password";

        }

    }
);


/* =========================
   MOSTRAR CONTRASENYA
========================= */

togglePassword.addEventListener(
    "click",
    function () {

        const visible =
            passwordInput.type === "text";


        passwordInput.type =
            visible
            ? "password"
            : "text";


        togglePassword.textContent =
            visible
            ? "👁"
            : "🙈";

    }
);


/* =========================
   EMAIL AUTH
========================= */

authForm.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();

        hideMessage();


        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;


        if (!email || !password) {

            showMessage(
                "Introdueix el correu i la contrasenya."
            );

            return;
        }


        emailButton.disabled =
            true;

        emailButton.textContent =
            isRegisterMode
            ? "Creant compte..."
            : "Iniciant sessió...";


        try {

            if (isRegisterMode) {

                const {
                    data,
                    error
                } =
                    await supabaseClient.auth.signUp({

                        email,
                        password

                    });


                if (error) {
                    throw error;
                }


                if (
                    data.user &&
                    !data.session
                ) {

                    showMessage(
                        "Compte creat. Revisa el teu correu per confirmar el compte.",
                        "success"
                    );

                }

                else {

                    await anarDespresLogin();

                }

            }

            else {

                const {
                    error
                } =
                    await supabaseClient.auth.signInWithPassword({

                        email,
                        password

                    });


                if (error) {
                    throw error;
                }


                await anarDespresLogin();

            }

        }

        catch (error) {

            console.error(
                "Authentication error:",
                error
            );


            showMessage(
                convertirError(error)
            );

        }

        finally {

            emailButton.disabled =
                false;

            emailButton.textContent =
                isRegisterMode
                ? "Crear compte"
                : "Iniciar sessió";

        }

    }
);


/* =========================
   GOOGLE
========================= */

googleButton.addEventListener(
    "click",
    async function () {

        hideMessage();


        googleButton.disabled =
            true;

        googleButton.classList.add(
            "loading"
        );


        try {

            const {
                error
            } =
                await supabaseClient.auth.signInWithOAuth({

                    provider: "google",

                    options: {

                        redirectTo:
                            window.location.origin +
                            BASE_PATH +
                            "login.html"

                    }

                });


            if (error) {
                throw error;
            }

        }

        catch (error) {

            console.error(
                "Google login error:",
                error
            );


            showMessage(
                "No s'ha pogut iniciar sessió amb Google."
            );


            googleButton.disabled =
                false;

            googleButton.classList.remove(
                "loading"
            );

        }

    }
);


/* =========================
   PASSWORD RESET
========================= */

forgotPassword.addEventListener(
    "click",
    async function () {

        hideMessage();


        const email =
            emailInput.value.trim();


        if (!email) {

            showMessage(
                "Escriu primer el teu correu electrònic."
            );

            emailInput.focus();

            return;

        }


        forgotPassword.disabled =
            true;


        try {

            const {
                error
            } =
                await supabaseClient.auth
                    .resetPasswordForEmail(
                        email,
                        {
                            redirectTo:
                                RESET_URL
                        }
                    );


            if (error) {
                throw error;
            }


            showMessage(
                "T'hem enviat un correu per recuperar la contrasenya.",
                "success"
            );

        }

        catch (error) {

            console.error(
                "Password reset error:",
                error
            );


            showMessage(
                convertirError(error)
            );

        }

        finally {

            forgotPassword.disabled =
                false;

        }

    }
);


/* =========================
   ERRORS
========================= */

function convertirError(error) {

    const message =
        error?.message || "";


    if (
        message.includes(
            "Invalid login credentials"
        )
    ) {

        return "El correu o la contrasenya no són correctes.";

    }


    if (
        message.includes(
            "User already registered"
        )
    ) {

        return "Aquest correu ja té un compte.";

    }


    if (
        message.includes(
            "Password should be at least"
        )
    ) {

        return "La contrasenya és massa curta.";

    }


    if (
        message.includes(
            "Email not confirmed"
        )
    ) {

        return "Has de confirmar el teu correu electrònic abans d'iniciar sessió.";

    }


    return message ||
        "S'ha produït un error. Torna-ho a provar.";

}


/* =========================
   COMPROVAR SESSIÓ
========================= */

async function comprovarSessio() {

    const {
        data
    } =
        await supabaseClient.auth.getSession();


    if (!data.session) {
        return;
    }


    await anarDespresLogin();

}


comprovarSessio();

</script>

</body>
</html>
