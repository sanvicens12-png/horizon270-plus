<!DOCTYPE html>

<html lang="ca">

<head>

```
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Iniciar sessió | HORIZON270+</title>

<meta
    name="description"
    content="Inicia sessió o crea el teu compte a HORIZON270+."
>

<style>

    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        min-height: 100%;
    }

    body {

        min-height: 100vh;

        background:
            radial-gradient(
                ellipse at center top,
                #242424 0%,
                #101010 45%,
                #000 90%
            );

        color: white;

        font-family:
            Arial,
            Helvetica,
            sans-serif;

    }


    /* =========================
       PAGE
    ========================= */

    .auth-page {

        min-height: 100vh;

        display: flex;

        justify-content: center;

        align-items: center;

        padding: 30px 20px;

    }


    .auth-container {

        width: 100%;

        max-width: 440px;

    }


    /* =========================
       LOGO
    ========================= */

    .auth-logo {

        display: block;

        text-align: center;

        margin-bottom: 30px;

        color: white;

        text-decoration: none;

        font-size: 30px;

        font-weight: 900;

        letter-spacing: 1px;

    }


    .auth-logo span {

        color: #bbb;

    }


    /* =========================
       CARD
    ========================= */

    .auth-card {

        background:
            rgba(18, 18, 18, .96);

        border:
            1px solid #292929;

        border-radius: 10px;

        padding: 35px;

        box-shadow:
            0 25px 70px
            rgba(0, 0, 0, .6);

    }


    /* =========================
       HEADER
    ========================= */

    .auth-header {

        text-align: center;

        margin-bottom: 28px;

    }


    .section-label {

        display: inline-block;

        color: #999;

        font-size: 12px;

        font-weight: bold;

        letter-spacing: 2px;

        margin-bottom: 12px;

    }


    .auth-header h1 {

        margin: 0 0 10px;

        font-size: 32px;

    }


    .auth-header p {

        margin: 0;

        color: #999;

        line-height: 1.5;

    }


    /* =========================
       MESSAGE
    ========================= */

    .auth-message {

        padding: 13px 15px;

        margin-bottom: 20px;

        border-radius: 6px;

        background: #181818;

        border: 1px solid #444;

        color: #ddd;

        line-height: 1.4;

    }


    .auth-message.error {

        border-color: #733;

        color: #ffb0b0;

    }


    .auth-message.success {

        border-color: #375f37;

        color: #b9ffb9;

    }


    /* =========================
       FIELDS
    ========================= */

    .auth-field {

        margin-bottom: 20px;

    }


    .auth-field label {

        display: block;

        margin-bottom: 8px;

        color: #ddd;

        font-size: 14px;

        font-weight: bold;

    }


    .auth-field input {

        width: 100%;

        padding: 14px;

        border:
            1px solid #555;

        border-radius: 5px;

        background: #080808;

        color: white;

        font-size: 16px;

    }


    .auth-field input:focus {

        outline: none;

        border-color: white;

        box-shadow:
            0 0 0 2px
            rgba(255,255,255,.15);

    }


    /* =========================
       PASSWORD
    ========================= */

    .password-label {

        display: flex;

        align-items: center;

        justify-content: space-between;

        gap: 10px;

    }


    .forgot-button {

        border: none;

        background: none;

        color: #aaa;

        cursor: pointer;

        font-size: 12px;

        padding: 0;

    }


    .forgot-button:hover {

        color: white;

        text-decoration: underline;

    }


    .password-input {

        position: relative;

    }


    .password-input input {

        padding-right: 50px;

    }


    .password-toggle {

        position: absolute;

        right: 5px;

        top: 50%;

        transform: translateY(-50%);

        width: 40px;

        height: 40px;

        border: none;

        background: transparent;

        color: white;

        cursor: pointer;

        font-size: 18px;

    }


    /* =========================
       SUBMIT
    ========================= */

    .auth-submit {

        width: 100%;

        padding: 14px;

        border: none;

        border-radius: 5px;

        background: white;

        color: black;

        font-size: 16px;

        font-weight: bold;

        cursor: pointer;

    }


    .auth-submit:hover {

        background: #ddd;

    }


    .auth-submit:disabled {

        opacity: .55;

        cursor: not-allowed;

    }


    /* =========================
       DIVIDER
    ========================= */

    .auth-divider {

        display: flex;

        align-items: center;

        gap: 12px;

        margin: 25px 0;

        color: #777;

        font-size: 13px;

    }


    .auth-divider::before,
    .auth-divider::after {

        content: "";

        flex: 1;

        height: 1px;

        background: #333;

    }


    /* =========================
       GOOGLE
    ========================= */

    .google-button {

        width: 100%;

        display: flex;

        align-items: center;

        justify-content: center;

        gap: 12px;

        padding: 13px;

        border:
            1px solid #555;

        border-radius: 5px;

        background: #111;

        color: white;

        cursor: pointer;

        font-size: 15px;

        font-weight: bold;

    }


    .google-button:hover {

        background: #1c1c1c;

        border-color: #777;

    }


    .google-button:disabled {

        opacity: .55;

        cursor: not-allowed;

    }


    .google-icon {

        width: 25px;

        height: 25px;

        display: flex;

        align-items: center;

        justify-content: center;

        border-radius: 50%;

        background: white;

        color: #4285f4;

        font-weight: bold;

    }


    /* =========================
       SWITCH
    ========================= */

    .auth-switch {

        margin-top: 25px;

        text-align: center;

        color: #888;

        font-size: 14px;

    }


    .auth-switch button {

        margin-left: 5px;

        border: none;

        background: none;

        color: white;

        cursor: pointer;

        font-weight: bold;

        padding: 0;

    }


    .auth-switch button:hover {

        text-decoration: underline;

    }


    /* =========================
       FOOTER
    ========================= */

    .auth-footer {

        margin: 22px 0 0;

        text-align: center;

        color: #666;

        font-size: 12px;

        line-height: 1.5;

    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 500px) {

        .auth-page {

            padding: 20px 15px;

        }


        .auth-card {

            padding: 25px 20px;

        }


        .auth-header h1 {

            font-size: 27px;

        }


        .auth-logo {

            font-size: 25px;

        }

    }

</style>
```

</head>

```

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://eftxwdpdweomffgurlgm.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_DPCJgsTp66cw2s-5S3CqNg_AdJEHKpt";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================
   ELEMENTS
========================= */

const authForm =
    document.getElementById(
        "authForm"
    );


const emailInput =
    document.getElementById(
        "email"
    );


const passwordInput =
    document.getElementById(
        "password"
    );


const emailButton =
    document.getElementById(
        "emailButton"
    );


const googleButton =
    document.getElementById(
        "googleButton"
    );


const togglePassword =
    document.getElementById(
        "togglePassword"
    );


const forgotPassword =
    document.getElementById(
        "forgotPassword"
    );


const switchMode =
    document.getElementById(
        "switchMode"
    );


const switchText =
    document.getElementById(
        "switchText"
    );


const authTitle =
    document.getElementById(
        "authTitle"
    );


const authSubtitle =
    document.getElementById(
        "authSubtitle"
    );


const authMessage =
    document.getElementById(
        "authMessage"
    );


let isRegisterMode = false;


/* =========================
   MESSAGE
========================= */

function showMessage(
    message,
    type = "error"
) {

    authMessage.textContent =
        message;

    authMessage.className =
        "auth-message " + type;

    authMessage.hidden =
        false;

}


function hideMessage() {

    authMessage.hidden =
        true;

    authMessage.textContent =
        "";

}


/* =========================
   GO TO PROFILES
========================= */

function goToProfiles() {

    window.location.href =
        "profiles.html";

}


/* =========================
   LOGIN / REGISTER MODE
========================= */

switchMode.addEventListener(
    "click",
    function() {

        isRegisterMode =
            !isRegisterMode;

        hideMessage();


        if (isRegisterMode) {

            authTitle.textContent =
                "Crea el teu compte";


            authSubtitle.textContent =
                "Uneix-te a HORIZON270+.";


            emailButton.textContent =
                "Crear compte";


            switchText.textContent =
                "Ja tens un compte?";


            switchMode.textContent =
                "Iniciar sessió";


            passwordInput.autocomplete =
                "new-password";

        }

        else {

            authTitle.textContent =
                "Inicia sessió";


            authSubtitle.textContent =
                "Accedeix al teu compte per continuar.";


            emailButton.textContent =
                "Iniciar sessió";


            switchText.textContent =
                "No tens compte?";


            switchMode.textContent =
                "Crear compte";


            passwordInput.autocomplete =
                "current-password";

        }

    }
);


/* =========================
   SHOW PASSWORD
========================= */

togglePassword.addEventListener(
    "click",
    function() {

        const visible =
            passwordInput.type === "text";


        passwordInput.type =
            visible
            ? "password"
            : "text";


        togglePassword.textContent =
            visible
            ? "👁"
            : "🙈";

    }
);


/* =========================
   EMAIL AUTH
========================= */

authForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        hideMessage();


        const email =
            emailInput.value.trim();


        const password =
            passwordInput.value;


        if (!email || !password) {

            showMessage(
                "Introdueix el correu i la contrasenya."
            );

            return;

        }


        emailButton.disabled =
            true;


        emailButton.textContent =
            isRegisterMode
            ? "Creant compte..."
            : "Iniciant sessió...";


        try {


            /* =========================
               REGISTER
            ========================= */

            if (isRegisterMode) {

                const {
                    data,
                    error
                } =
                    await supabaseClient.auth.signUp({

                        email,
                        password,

                        options: {

                            emailRedirectTo:
                                window.location.origin +
                                "/horizon270-plus/profiles.html"

                        }

                    });


                if (error) {

                    throw error;

                }


                /*
                 * Si Supabase demana confirmació
                 * de correu, no entrem encara.
                 */

                if (
                    data.user &&
                    !data.session
                ) {

                    showMessage(
                        "Compte creat. Revisa el teu correu per confirmar el compte.",
                        "success"
                    );

                }

                else {

                    goToProfiles();

                }

            }


            /* =========================
               LOGIN
            ========================= */

            else {

                const {
                    data,
                    error
                } =
                    await supabaseClient.auth
                        .signInWithPassword({

                            email,
                            password

                        });


                if (error) {

                    throw error;

                }


                if (
                    data &&
                    data.session
                ) {

                    goToProfiles();

                }

            }


        }

        catch (error) {

            console.error(
                "Authentication error:",
                error
            );


            showMessage(
                convertirError(error)
            );

        }


        finally {

            emailButton.disabled =
                false;


            emailButton.textContent =
                isRegisterMode
                ? "Crear compte"
                : "Iniciar sessió";

        }

    }
);


/* =========================
   GOOGLE
========================= */

googleButton.addEventListener(
    "click",
    async function() {

        hideMessage();


        googleButton.disabled =
            true;


        googleButton.classList.add(
            "loading"
        );


        try {

            const {
                error
            } =
                await supabaseClient.auth
                    .signInWithOAuth({

                        provider: "google",

                        options: {

                            redirectTo:
                                window.location.origin +
                                "/horizon270-plus/profiles.html"

                        }

                    });


            if (error) {

                throw error;

            }

        }

        catch (error) {

            console.error(
                "Google login error:",
                error
            );


            showMessage(
                "No s'ha pogut iniciar sessió amb Google."
            );


            googleButton.disabled =
                false;


            googleButton.classList.remove(
                "loading"
            );

        }

    }
);


/* =========================
   PASSWORD RESET
========================= */

forgotPassword.addEventListener(
    "click",
    async function() {

        hideMessage();


        const email =
            emailInput.value.trim();


        if (!email) {

            showMessage(
                "Escriu primer el teu correu electrònic."
            );


            emailInput.focus();


            return;

        }


        forgotPassword.disabled =
            true;


        try {

            const {
                error
            } =
                await supabaseClient.auth
                    .resetPasswordForEmail(
                        email,
                        {

                            redirectTo:
                                window.location.origin +
                                "/horizon270-plus/reset-password.html"

                        }
                    );


            if (error) {

                throw error;

            }


            showMessage(
                "T'hem enviat un correu per recuperar la contrasenya.",
                "success"
            );

        }

        catch (error) {

            console.error(
                "Password reset error:",
                error
            );


            showMessage(
                convertirError(error)
            );

        }

        finally {

            forgotPassword.disabled =
                false;

        }

    }
);


/* =========================
   ERRORS
========================= */

function convertirError(error) {

    const message =
        error?.message || "";


    if (
        message.includes(
            "Invalid login credentials"
        )
    ) {

        return "El correu o la contrasenya no són correctes.";

    }


    if (
        message.includes(
            "User already registered"
        )
    ) {

        return "Aquest correu ja té un compte.";

    }


    if (
        message.includes(
            "Password should be at least"
        )
    ) {

        return "La contrasenya és massa curta.";

    }


    if (
        message.includes(
            "Email not confirmed"
        )
    ) {

        return "Has de confirmar el teu correu electrònic abans d'iniciar sessió.";

    }


    return message ||
        "S'ha produït un error. Torna-ho a provar.";

}


/* =========================
   CHECK EXISTING SESSION
========================= */

async function comprovarSessio() {

    const {
        data
    } =
        await supabaseClient.auth.getSession();


    if (
        data &&
        data.session
    ) {

        /*
         * Si ja està autenticat,
         * no ha de veure el login.
         */

        goToProfiles();

    }

}


comprovarSessio();


</script>

</body>
