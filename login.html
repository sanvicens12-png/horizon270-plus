<!DOCTYPE html>

<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HORIZON270+ | Login</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#050505;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}
.box{
    width:90%;
    max-width:420px;
    background:#111;
    border:1px solid #292929;
    border-radius:8px;
    padding:35px;
}
.logo{
    text-align:center;
    font-size:28px;
    font-weight:900;
    margin-bottom:30px;
}
.logo span{color:#aaa}
h1{text-align:center}
.subtitle{text-align:center;color:#999;margin-bottom:25px}
input{
    width:100%;
    padding:14px;
    margin:7px 0 17px;
    background:#080808;
    border:1px solid #555;
    color:white;
    border-radius:5px;
    font-size:16px;
}
button{
    width:100%;
    padding:14px;
    border-radius:5px;
    cursor:pointer;
    font-weight:bold;
    font-size:15px;
}
.primary{
    border:0;
    background:white;
    color:black;
}
.google{
    margin-top:15px;
    background:#111;
    border:1px solid #555;
    color:white;
}
.switch{
    margin-top:25px;
    text-align:center;
    color:#888;
}
.switch button{
    width:auto;
    border:0;
    background:none;
    color:white;
}
.message{
    margin-bottom:15px;
    padding:12px;
    background:#191919;
    border-radius:5px;
}
</style>

</head>

<body>

<div class="box">

<div class="logo">
HORIZON<span>270+</span>
</div>

<h1 id="title">Inicia sessió</h1>

<p class="subtitle" id="subtitle">
Accedeix al teu compte.
</p>

<div id="message" class="message" hidden></div>

<form id="form">

<label>Correu electrònic</label>

<input
id="email"
type="email"
required
autocomplete="email"

>

<label>Contrasenya</label>

<input
id="password"
type="password"
required
autocomplete="current-password"

>

<button
class="primary"
id="submit"
type="submit"

>

Iniciar sessió </button>

</form>

<button
class="google"
id="google"

>

Continuar amb Google </button>

<div class="switch">

<span id="switchText">
No tens compte?
</span>

<button id="switch">
Crear compte
</button>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://eftxwdpdweomffgurlgm.supabase.co";

const SUPABASE_KEY =
"sb_publishable_DPCJgsTp66cw2s-5S3CqNg_AdJEHKpt";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const form=document.getElementById("form");
const email=document.getElementById("email");
const password=document.getElementById("password");
const submit=document.getElementById("submit");
const google=document.getElementById("google");
const message=document.getElementById("message");
const switchButton=document.getElementById("switch");
const title=document.getElementById("title");
const subtitle=document.getElementById("subtitle");
const switchText=document.getElementById("switchText");

let register=false;

function profiles(){
    window.location.replace("profiles.html");
}

function show(text){
    message.textContent=text;
    message.hidden=false;
}

async function check(){

    const {data}=await supabaseClient.auth.getSession();

    if(data.session){
        profiles();
    }
}

check();

supabaseClient.auth.onAuthStateChange(
    (event,session)=>{

        if(session){
            profiles();
        }

    }
);

switchButton.onclick=()=>{

    register=!register;

    if(register){

        title.textContent="Crear compte";
        subtitle.textContent="Crea el teu compte gratuït.";
        submit.textContent="Crear compte";
        switchText.textContent="Ja tens un compte?";
        switchButton.textContent="Iniciar sessió";

    }else{

        title.textContent="Inicia sessió";
        subtitle.textContent="Accedeix al teu compte.";
        submit.textContent="Iniciar sessió";
        switchText.textContent="No tens compte?";
        switchButton.textContent="Crear compte";

    }

};

form.onsubmit=async(e)=>{

    e.preventDefault();

    message.hidden=true;
    submit.disabled=true;

    try{

        if(register){

            const {data,error} =
            await supabaseClient.auth.signUp({
                email:email.value.trim(),
                password:password.value
            });

            if(error) throw error;

            if(data.session){
                profiles();
            }else{
                show(
                    "Compte creat. Revisa el teu correu per confirmar-lo."
                );
            }

        }else{

            const {data,error} =
            await supabaseClient.auth.signInWithPassword({
                email:email.value.trim(),
                password:password.value
            });

            if(error) throw error;

            if(data.session){
                profiles();
            }

        }

    }catch(error){

        show(
            error.message ||
            "No s'ha pogut completar l'operació."
        );

    }

    submit.disabled=false;

};

google.onclick=async()=>{

    google.disabled=true;

    const {error} =
    await supabaseClient.auth.signInWithOAuth({

        provider:"google",

        options:{
            redirectTo:
            window.location.origin +
            window.location.pathname
        }

    });

    if(error){

        show(error.message);

        google.disabled=false;

    }

};

</script>

</body>
</html>
