<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pujar vídeo | HORIZON270+</title>

    <meta
        name="description"
        content="Puja un vídeo a HORIZON270+."
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="topbar">

        <div class="topbar-inner">

            <a href="index.html" class="logo">
                HORIZON<span>270+</span>
            </a>

            <nav class="main-nav">

                <a href="index.html" class="nav-link">
                    Inici
                </a>

                <a href="watch.html" class="nav-link">
                    Explorar
                </a>

            </nav>

            <a
                href="upload.html"
                class="upload-button"
            >
                Pujar
            </a>

        </div>

    </header>


    <main>

        <section class="upload-page">

            <div class="upload-header">

                <span class="section-label">
                    CREADORS
                </span>

                <h1>
                    Puja el teu vídeo
                </h1>

                <p>
                    Comparteix el teu contingut amb la comunitat
                    de HORIZON270+.
                </p>

            </div>


            <form class="upload-form">

                <!-- TÍTOL -->

                <div class="form-group">

                    <label for="title">
                        Títol del vídeo
                    </label>

                    <input
                        id="title"
                        name="title"
                        type="text"
                        placeholder="Escriu el títol del vídeo"
                        maxlength="150"
                        required
                    >

                </div>


                <!-- DESCRIPCIÓ -->

                <div class="form-group">

                    <label for="description">
                        Descripció
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        placeholder="Explica de què tracta el teu vídeo"
                        rows="6"
                        maxlength="5000"
                    ></textarea>

                </div>


                <!-- VÍDEO -->

                <div class="form-group">

                    <label for="video">
                        Fitxer de vídeo
                    </label>

                    <div class="file-upload">

                        <input
                            id="video"
                            name="video"
                            type="file"
                            accept="video/*"
                            required
                        >

                        <label
                            for="video"
                            class="file-upload-label"
                        >
                            <strong>
                                Selecciona un vídeo
                            </strong>

                            <span>
                                MP4, WebM o altres formats de vídeo compatibles
                            </span>
                        </label>

                    </div>

                    <p
                        id="video-name"
                        class="file-name"
                    ></p>

                </div>


                <!-- MINIATURA -->

                <div class="form-group">

                    <label for="thumbnail">
                        Miniatura
                    </label>

                    <div class="thumbnail-upload">

                        <input
                            id="thumbnail"
                            name="thumbnail"
                            type="file"
                            accept="image/jpeg,image/png,image/webp"
                            required
                        >

                        <label
                            for="thumbnail"
                            class="thumbnail-upload-label"
                        >
                            <strong>
                                Selecciona una miniatura
                            </strong>

                            <span>
                                JPG, PNG o WEBP
                            </span>
                        </label>

                        <div
                            id="thumbnail-preview"
                            class="thumbnail-preview"
                            hidden
                        >
                            <img
                                id="thumbnail-image"
                                src=""
                                alt="Previsualització de la miniatura"
                            >

                            <button
                                id="remove-thumbnail"
                                type="button"
                                class="remove-thumbnail"
                            >
                                Canviar miniatura
                            </button>
                        </div>

                    </div>

                </div>


                <!-- ACCIONS -->

                <div class="upload-actions">

                    <a
                        href="index.html"
                        class="secondary-button"
                    >
                        Cancel·lar
                    </a>

                    <button
                        type="submit"
                        class="primary-button"
                    >
                        Pujar vídeo
                    </button>

                </div>

            </form>

        </section>

    </main>


    <footer class="footer">

        <div class="footer-inner">

            <a href="index.html" class="footer-logo">
                HORIZON<span>270+</span>
            </a>

            <p>
                HORIZON270+ — Plataforma de vídeo.
            </p>

        </div>

    </footer>


    <script>

        const videoInput = document.getElementById("video");
        const videoName = document.getElementById("video-name");

        const thumbnailInput = document.getElementById("thumbnail");
        const thumbnailPreview = document.getElementById("thumbnail-preview");
        const thumbnailImage = document.getElementById("thumbnail-image");
        const removeThumbnail = document.getElementById("remove-thumbnail");


        videoInput.addEventListener("change", function () {

            if (videoInput.files.length > 0) {

                videoName.textContent =
                    "Vídeo seleccionat: " +
                    videoInput.files[0].name;

            } else {

                videoName.textContent = "";

            }

        });


        thumbnailInput.addEventListener("change", function () {

            const file = thumbnailInput.files[0];

            if (!file) {
                thumbnailPreview.hidden = true;
                thumbnailImage.src = "";
                return;
            }

            if (!file.type.startsWith("image/")) {
                thumbnailInput.value = "";
                thumbnailPreview.hidden = true;
                thumbnailImage.src = "";
                return;
            }

            const imageURL = URL.createObjectURL(file);

            thumbnailImage.src = imageURL;
            thumbnailPreview.hidden = false;

        });


        removeThumbnail.addEventListener("click", function () {

            thumbnailInput.value = "";
            thumbnailPreview.hidden = true;
            thumbnailImage.src = "";

        });


        document
            .querySelector(".upload-form")
            .addEventListener("submit", function (event) {

                event.preventDefault();

                alert(
                    "La interfície de pujada està preparada. " +
                    "La pujada real del vídeo encara necessita connectar-se " +
                    "a un sistema d'emmagatzematge."
                );

            });

    </script>

</body>
</html>
