<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pujar vídeo | HORIZON270+</title>

    <meta
        name="description"
        content="Puja un vídeo a HORIZON270+."
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="topbar">

        <div class="topbar-inner">

            <a href="index.html" class="logo">
                HORIZON<span>270+</span>
            </a>

            <nav class="main-nav">

                <a href="index.html" class="nav-link">
                    Inici
                </a>

                <a href="watch.html" class="nav-link">
                    Explorar
                </a>

            </nav>

            <a
                href="upload.html"
                class="upload-button"
            >
                Pujar
            </a>

        </div>

    </header>


    <main>

        <section class="upload-page">

            <div class="upload-header">

                <span class="section-label">
                    CREADORS
                </span>

                <h1>
                    Puja el teu vídeo
                </h1>

                <p>
                    Comparteix el teu contingut amb la comunitat
                    de HORIZON270+.
                </p>

            </div>


            <form class="upload-form">

                <div class="form-group">

                    <label for="title">
                        Títol del vídeo
                    </label>

                    <input
                        id="title"
                        name="title"
                        type="text"
                        placeholder="Escriu el títol del vídeo"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="description">
                        Descripció
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        placeholder="Explica de què tracta el teu vídeo"
                        rows="6"
                    ></textarea>

                </div>


                <div class="form-group">

                    <label for="video">
                        Fitxer de vídeo
                    </label>

                    <div class="file-upload">

                        <input
                            id="video"
                            name="video"
                            type="file"
                            accept="video/*"
                            required
                        >

                        <label
                            for="video"
                            class="file-upload-label"
                        >
                            <strong>
                                Selecciona un vídeo
                            </strong>

                            <span>
                                Formats de vídeo compatibles
                            </span>
                        </label>

                    </div>

                </div>


                <div class="upload-actions">

                    <a
                        href="index.html"
                        class="secondary-button"
                    >
                        Cancel·lar
                    </a>

                    <button
                        type="submit"
                        class="primary-button"
                    >
                        Pujar vídeo
                    </button>

                </div>

            </form>

        </section>

    </main>


    <footer class="footer">

        <div class="footer-inner">

            <a href="index.html" class="footer-logo">
                HORIZON<span>270+</span>
            </a>

            <p>
                HORIZON270+ — Plataforma de vídeo.
            </p>

        </div>

    </footer>

</body>
</html>
